name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04   # needed for Python 3.8; switch to ubuntu-latest if you drop 3.8
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lib/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "lib[dev]"
      - name: Lint
        run: ruff check lib
      - name: Test library
        run: pytest
        working-directory: lib
      - name: Test app logic
        run: pytest script/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check package
        working-directory: lib
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
