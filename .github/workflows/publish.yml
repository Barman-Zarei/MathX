name: Publish

on:
  push:
    tags:
      - "v[0-1000]+.[0-1000]+.[0-1000]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          with open("lib/pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag:
              raise SystemExit(f"Tag v{tag} does not match pyproject version {version}")
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e "lib[dev]"
      - name: Lint and test
        run: |
          ruff check lib
          pytest lib
          pytest script/tests
      - name: Build and check package
        working-directory: lib
        run: |
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: lib/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
